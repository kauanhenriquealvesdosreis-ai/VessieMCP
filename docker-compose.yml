version: '3.8'

services:
  vessie-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: vessie-mcp
    ports:
      - "${PORT:-3000}:3000"
      - "${MCP_HTTP_PORT:-3001}:3001"
      - "${MCP_WS_PORT:-3002}:3002"
      - "${PROMETHEUS_PORT:-9090}:9090"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/vessie_mcp?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./plugins:/app/plugins
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - vessie-network

  db:
    image: postgres:16-alpine
    container_name: vessie-mcp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vessie_mcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - vessie-network

  redis:
    image: redis:7-alpine
    container_name: vessie-mcp-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - vessie-network

  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: vessie-mcp-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - vessie-network

  grafana:
    image: grafana/grafana-enterprise:10.2.0
    container_name: vessie-mcp-grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - vessie-network

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: vessie-mcp-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    restart: unless-stopped
    networks:
      - vessie-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  vessie-network:
    driver: bridge
</arg_value>
